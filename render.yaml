# Render Blueprint for the ServiceDesk API. This is optional infrastructure-as-code — you can
# instead create the Web Service by hand in the Render dashboard using the same settings (see
# DEPLOYMENT.md). If you do use this file: Render dashboard -> New -> Blueprint -> point at this
# repo -> it reads this file automatically. Secrets (DATABASE_URL, JWT secrets, bootstrap admin
# credentials) are deliberately NOT in this file — Render will prompt you to fill them in as
# "sync: false" envVars so nothing sensitive ends up committed to git.
#
# buildCommand passes `--include=dev` — Render's build environment has NODE_ENV=production set
# (both a platform default and set explicitly below, needed at RUNTIME), and npm honors that by
# silently omitting devDependencies during install, even under `npm ci`. That's fatal here because
# devDependencies include the entire TypeScript toolchain the build itself needs (typescript,
# @types/node, ...) — confirmed locally: `NODE_ENV=production npm ci` reproduces Render's exact
# reduced package count and the same TS2688 "Cannot find type definition file for 'node'" failure;
# `--include=dev` overrides the omission regardless of NODE_ENV and fixes it.
services:
  - type: web
    name: servicedesk-api
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build --workspace packages/shared && npm run build --workspace apps/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: LOGIN_RATE_LIMIT
        value: 20
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
